# yaml-language-server: $schema=../../../schemas/scenario_move.schema.json
id: strike_a_deal
name: Strike a deal with Corwin
category: special
trigger: When you offer Corwin your silence for a share of his trade
requires:
  all:
    - {secret_revealed: corwin_is_wererat}
    - {npc_with_pc: corwin}
target: true
roll: stat.cha
outcomes:
  strong:
    text: Corwin laughs and shakes on it.
    effects:
      - add_tag: {tag: bargained, target: target}
  partial:
    text: Corwin agrees, but he wants a token of good faith, now.
    effects:
      - add_tag: {tag: bargained, target: target}
      - gm_move: soft
  miss:
    text: The GM makes a move.
    effects:
      - gm_move: hard
