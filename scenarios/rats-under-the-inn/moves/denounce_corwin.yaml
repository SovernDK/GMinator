# yaml-language-server: $schema=../../../schemas/scenario_move.schema.json
id: denounce_corwin
name: Denounce Corwin
category: special
trigger: When you lay out the proof of what Corwin is before someone who can act on it
requires:
  all:
    - {secret_revealed: corwin_is_wererat}
    - {npc_with_pc: maud}
target: true
roll: stat.cha
outcomes:
  strong:
    text: They believe you, every word.
    effects:
      - add_tag: {tag: convinced, target: target}
  partial:
    text: They believe you, but the telling costs you.
    effects:
      - add_tag: {tag: convinced, target: target}
      - gm_move: soft
  miss:
    effects:
      - gm_move: hard
