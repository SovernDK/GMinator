system: dungeon-world
start: common_room
intro: >-
  Rain hammers the shutters of the Drowned Rat. Maud, the innkeeper, has offered you a month
  of board to clear the giant rats out of her cellar. Her business partner, Corwin, smiles
  into his cup and says it is only a few rats. The stable hand, Pip, will not meet your eye.
