# yaml-language-server: $schema=../../schemas/secrets.schema.json
- id: inn_smuggling
  text: >-
    Maud lets contraband pass through her cellar and takes a cut. She does not know what
    Corwin really is.
- id: pip_saw_corwin
  text: Pip has seen Corwin at night, whistling rats into the cellar like dogs.
- id: corwin_is_wererat
  text: >-
    Corwin is a wererat. He runs goods through the caves with a half-trained rat swarm, and
    the swarm is slipping out of his control.
