# yaml-language-server: $schema=../../../schemas/move.schema.json
# Dungeon World also lets you simply deal your damage instead of rolling; not in the MVP.
id: backstab
name: Backstab
category: class
trigger: When you attack a surprised or defenseless enemy with a melee weapon
flags: [combat]
target: true
roll: stat.dex
outcomes:
  strong:
    text: Choose two.
    effects:
      - choose_n: &backstab
          n: 2
          options:
            - label: You don't get into melee with them
            - label: You deal your damage +1d6
              effects:
                - deal_damage: {amount: self.damage + d6}
            - label: You create an advantage, +1 forward to you or an ally acting on it
              effects:
                - add_forward: {amount: 1}
            - label: Reduce their armor by 1 until they repair it
  partial:
    text: Choose one.
    effects:
      - choose_n:
          <<: *backstab
          n: 1
  miss:
    effects:
      - gm_move: hard
