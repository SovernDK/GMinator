# yaml-language-server: $schema=../../../schemas/move.schema.json
id: defend
name: Defend
category: basic
trigger: When you stand in defense of a person, item, or location under attack
roll: stat.con
outcomes:
  strong:
    text: Hold 3. Spend hold when you or the thing you defend is attacked.
    effects:
      - gain_hold: {amount: 3}
  partial:
    text: Hold 1. Spend hold when you or the thing you defend is attacked.
    effects:
      - gain_hold: {amount: 1}
  miss:
    text: The GM makes a move.
    effects:
      - gm_move: hard
