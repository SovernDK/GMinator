# yaml-language-server: $schema=../../../schemas/move.schema.json
id: hack_and_slash
name: Hack and Slash
category: basic
trigger: When you attack an enemy in melee
target: true
roll: stat.str
outcomes:
  strong:
    text: You deal your damage to the enemy and avoid their attack.
    effects:
      - choose_n:
          n: 1
          options:
            - label: Deal your damage and avoid their attack
              effects:
                - deal_damage: {amount: self.damage}
            - label: Deal +1d6 damage, but expose yourself to their attack
              effects:
                - deal_damage: {amount: self.damage + d6}
                - take_damage: {amount: target.damage}
  partial:
    text: You deal your damage to the enemy, and the enemy makes an attack against you.
    effects:
      - deal_damage: {amount: self.damage}
      - take_damage: {amount: target.damage}
  miss:
    text: The GM makes a move.
    effects:
      - gm_move: hard
