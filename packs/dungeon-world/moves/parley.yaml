# yaml-language-server: $schema=../../../schemas/move.schema.json
id: parley
name: Parley
category: basic
trigger: When you have leverage on a GM character and manipulate them
target: true
roll: stat.cha
outcomes:
  strong:
    text: They either do what you ask or tell you what it will take to make them do it.
  partial:
    text: They will do it, but need some concrete assurance of your promise, right now.
  miss:
    text: The GM makes a move.
    effects:
      - gm_move: hard
