# yaml-language-server: $schema=../../../schemas/move.schema.json
id: volley
name: Volley
category: basic
trigger: When you take aim and shoot at an enemy at range
flags: [combat]
target: true
roll: stat.dex
outcomes:
  strong:
    text: You have a clear shot. Deal your damage.
    effects:
      - deal_damage: {amount: self.damage}
  partial:
    text: You hit, but at a price.
    effects:
      - choose_n:
          n: 1
          options:
            - label: You have to move to get the shot, placing you in danger
              effects:
                - deal_damage: {amount: self.damage}
                - gm_move: soft
            - label: You have to take what you can get, -1d6 damage
              effects:
                - deal_damage: {amount: self.damage - d6}
            - label: You have to take several shots, reducing your ammo by one
              effects:
                - use_item: {tag: ammo}
                - deal_damage: {amount: self.damage}
  miss:
    effects:
      - gm_move: hard
