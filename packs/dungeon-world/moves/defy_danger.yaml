# yaml-language-server: $schema=../../../schemas/move.schema.json
id: defy_danger
name: Defy Danger
category: basic
trigger: When you act despite an imminent threat or suffer a calamity
roll: stat.chosen
stat_options: [str, dex, con, int, wis, cha]
outcomes:
  strong:
    text: You do what you set out to; the threat doesn't come to bear.
  partial:
    text: >-
      You stumble, hesitate, or flinch. The GM will offer you a worse outcome,
      a hard bargain, or an ugly choice.
    effects:
      - gm_move: soft
  miss:
    text: The GM makes a move.
    effects:
      - gm_move: hard
