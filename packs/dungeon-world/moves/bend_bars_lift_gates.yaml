# yaml-language-server: $schema=../../../schemas/move.schema.json
id: bend_bars_lift_gates
name: Bend Bars, Lift Gates
category: class
trigger: When you use pure strength to destroy an inanimate obstacle
target: obstacle
roll: stat.str
outcomes:
  strong:
    text: You do it.
    effects:
      - clear_obstacle: target
  partial:
    text: You still do it, but choose one.
    effects:
      - clear_obstacle: target
      - choose_n:
          n: 1
          options:
            - label: It takes a while
            - label: Something of value breaks
            - label: It makes an awful lot of noise
  miss:
    effects:
      - gm_move: hard
