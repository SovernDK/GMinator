# yaml-language-server: $schema=../../../schemas/move.schema.json
id: trap_expert
name: Trap Expert
category: class
trigger: When you spend a moment to survey a dangerous area
roll: stat.dex
outcomes:
  strong:
    text: Hold 3. Spend hold as you walk through the area to ask questions.
    effects:
      - gain_hold: {amount: 3}
  partial:
    text: Hold 1. Spend hold as you walk through the area to ask a question.
    effects:
      - gain_hold: {amount: 1}
  miss:
    text: The GM makes a move.
    effects:
      - gm_move: hard
