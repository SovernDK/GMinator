[project]
name = "gminator"
version = "0.1.0"
description = "A single-player terminal RPG on a Powered by the Apocalypse engine, with a small local AI as narrator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.3.1",
    "pydantic>=2.14.1",
    "ruamel-yaml>=0.19.1",
    "textual>=8.2.8",
]

[project.scripts]
gminator = "gminator.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]
